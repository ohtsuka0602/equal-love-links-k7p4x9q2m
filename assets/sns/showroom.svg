<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title>SHOWROOM</title>
  <defs>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="12" fill="#050505"/>
  <text x="32" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" filter="url(#glow)">
    <tspan fill="#ff9c21">S</tspan><tspan fill="#ffd93b">H</tspan><tspan fill="#f5ff4a">O</tspan><tspan fill="#35d769">W</tspan>
  </text>
  <text x="32" y="45" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.1" filter="url(#glow)">
    <tspan fill="#5dd7ff">R</tspan><tspan fill="#4aa3ff">O</tspan><tspan fill="#b678d8">O</tspan><tspan fill="#ff6ca8">M</tspan>
  </text>
</svg>

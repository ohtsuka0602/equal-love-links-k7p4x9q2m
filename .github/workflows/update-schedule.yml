name: Update schedule

on:
  # Primary automation is an external cron that calls workflow_dispatch.
  # GitHub's native schedule is kept only as a best-effort fallback.
  schedule:
    - cron: "13 14 * * *"
  workflow_dispatch:

concurrency:
  group: equal-love-data-updates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Fetch schedule
        run: npm run fetch:schedule

      - name: Update change history
        run: npm run history:update

      - name: Upload schedule debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schedule-debug
          path: |
            debug/schedule.html
            debug/schedule-summary.json
          if-no-files-found: ignore

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          cleanup() {
            rm -rf "$tmp_dir"
          }
          trap cleanup EXIT

          mkdir -p "$tmp_dir/data"
          cp data/schedule.json "$tmp_dir/data/schedule.json"
          cp data/change-history.json "$tmp_dir/data/change-history.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Commit/push attempt ${attempt}"
            git fetch origin main
            git reset --hard origin/main

            mkdir -p data
            cp "$tmp_dir/data/schedule.json" data/schedule.json
            cp "$tmp_dir/data/change-history.json" data/change-history.json

            echo "Current HEAD: $(git rev-parse --short HEAD)"
            echo "Origin main: $(git rev-parse --short origin/main)"
            git status --short
            git diff -- data/schedule.json data/change-history.json

            git add data/schedule.json data/change-history.json

            if git diff --cached --quiet; then
              echo "No changes to commit."
              exit 0
            fi

            git commit -m "Update schedule"

            if git push origin HEAD:main; then
              echo "Pushed schedule successfully."
              exit 0
            fi

            echo "Push failed, retrying after refreshing origin/main."
            sleep $((attempt * 10))
          done

          echo "Push failed after retries."
          exit 1

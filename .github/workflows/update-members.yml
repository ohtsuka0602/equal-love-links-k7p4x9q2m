name: Update members

on:
  schedule:
    - cron: "43 2,8,14,20 * * *"
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: equal-love-data-updates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-schedule-event:
    if: github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest

    steps:
      - name: Confirm schedule event
        run: echo "Temporary schedule probe run was created."

  update-members:
    if: github.event_name != 'schedule' || github.event.schedule != '*/15 * * * *'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Fetch member links
        run: npm run fetch

      - name: Fetch YouTube videos
        run: npm run fetch:youtube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Fetch latest news
        run: npm run fetch:news

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          cleanup() {
            rm -rf "$tmp_dir"
          }
          trap cleanup EXIT

          mkdir -p "$tmp_dir/data" "$tmp_dir/assets"
          cp data/members.json "$tmp_dir/data/members.json"
          cp data/youtube-videos.json "$tmp_dir/data/youtube-videos.json"
          cp data/news.json "$tmp_dir/data/news.json"
          cp -R assets/members "$tmp_dir/assets/members"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Commit/push attempt ${attempt}"
            git fetch origin main
            git reset --hard origin/main

            mkdir -p data assets
            cp "$tmp_dir/data/members.json" data/members.json
            cp "$tmp_dir/data/youtube-videos.json" data/youtube-videos.json
            cp "$tmp_dir/data/news.json" data/news.json
            rm -rf assets/members
            cp -R "$tmp_dir/assets/members" assets/members

            echo "Current HEAD: $(git rev-parse --short HEAD)"
            echo "Origin main: $(git rev-parse --short origin/main)"
            git status --short

            git add data/members.json data/youtube-videos.json data/news.json assets/members

            if git diff --cached --quiet; then
              echo "No changes to commit."
              exit 0
            fi

            git commit -m "Update member SNS links, YouTube videos, and news"

            if git push origin HEAD:main; then
              echo "Pushed generated data successfully."
              exit 0
            fi

            echo "Push failed, retrying after refreshing origin/main."
            sleep $((attempt * 10))
          done

          echo "Push failed after retries."
          exit 1

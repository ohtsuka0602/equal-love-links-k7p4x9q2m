<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="=LOVE情報まとめ" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>=LOVE Dashboard</title>
  <link rel="apple-touch-icon" href="assets/app-icon.png?v=20260607-5" />
  <link rel="icon" href="assets/app-icon.png?v=20260607-5" />
  <link rel="manifest" href="manifest.json?v=20260607-5" />
  <link rel="stylesheet" href="style.css?v=20260609-1" />
</head>
<body>
  <header class="app-header">
    <div>
      <h1>=LOVE Dashboard</h1>
      <p class="lead">情報まとめ</p>
    </div>
  </header>

  <main class="app-main">
    <section class="controls" aria-label="表示条件">
      <div class="filter-buttons" role="tablist" aria-label="SNSで絞り込み">
        <button class="filter-button active" type="button" data-filter="home">Home</button>
        <button class="filter-button" type="button" data-filter="youtube">YouTube</button>
        <button class="filter-button" type="button" data-filter="instagram">Instagram</button>
        <button class="filter-button" type="button" data-filter="x">X</button>
        <button class="filter-button" type="button" data-filter="tiktok">TikTok</button>
        <button class="filter-button" type="button" data-filter="showroom">SHOWROOM</button>
      </div>

      <div class="target-buttons" role="tablist" aria-label="表示対象">
        <button class="target-button" type="button" data-target="favorites">推しだけ</button>
        <button class="target-button active" type="button" data-target="all">全員</button>
      </div>

      <div class="reload-row">
        <button id="reloadButton" class="reload-button" type="button">更新</button>
        <p id="updatedAt" class="updated-at"></p>
      </div>
    </section>

    <section id="homeDashboard" class="home-dashboard" aria-live="polite"></section>
    <section id="dailyPick" class="daily-pick" aria-live="polite"></section>
    <section id="youtubeVideos" class="youtube-videos" aria-live="polite" hidden></section>

    <section class="summary" aria-live="polite">
      <p id="status">読み込み中...</p>
    </section>

    <section id="memberList" class="member-list" aria-label="SNSリンク一覧"></section>
  </main>

  <script src="app.js?v=20260608-7"></script>
</body>
</html>

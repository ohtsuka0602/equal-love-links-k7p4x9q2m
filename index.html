<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>=LOVE SNS Links</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">Personal link index</p>
      <h1>=LOVE SNS Links</h1>
      <p class="lead">メンバーと公式アカウントのSNSリンク集</p>
    </div>
  </header>

  <main class="app-main">
    <section class="controls" aria-label="表示条件">
      <label class="search-wrap">
        <span class="visually-hidden">メンバー名で検索</span>
        <input id="searchInput" type="search" placeholder="名前で検索" autocomplete="off" />
      </label>

      <div class="filter-buttons" role="tablist" aria-label="SNSで絞り込み">
        <button class="filter-button active" type="button" data-filter="all">All</button>
        <button class="filter-button" type="button" data-filter="instagram">Instagram</button>
        <button class="filter-button" type="button" data-filter="x">X</button>
        <button class="filter-button" type="button" data-filter="tiktok">TikTok</button>
      </div>

      <button id="reloadButton" class="reload-button" type="button">更新</button>
    </section>

    <section class="summary" aria-live="polite">
      <p id="status">読み込み中...</p>
    </section>

    <section id="memberList" class="member-list" aria-label="SNSリンク一覧"></section>
  </main>

  <script src="app.js?v=20260607-2"></script>
</body>
</html>
